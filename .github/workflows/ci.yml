name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -U pip && python -m pip install .
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: CLI smoke test
        run: |
          eval-failure-clusterer cluster examples/eval_results.jsonl --output build/cluster
          eval-failure-clusterer compare examples/baseline_eval.jsonl examples/eval_results.jsonl --output build/compare
          eval-failure-clusterer check examples/eval_results.jsonl --output build/check --check error || test $? -eq 2
